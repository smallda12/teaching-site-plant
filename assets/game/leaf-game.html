<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找一找葉子｜植物小百科小遊戲</title>
<style>
:root{
  color-scheme: light;
  --bg:#F1F8E9; --ink:#1A1A1A; --deep:#1B5E20; --green:#2E7D32; --soft:#A5D6A7;
  --orange:#C2410C; --red:#C62828; --ok:#15803D; --edge:#37474F; --focus:#FBBF24;
  --lf: clamp(104px, min(26vmin, 30vh), 210px);   /* 一片「標準大」葉子的寬度，其餘都用它乘上比例 */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC","PingFang TC",sans-serif;
  font-size:24px; line-height:1.35;
  display:grid; grid-template-rows:auto 1fr; height:100dvh; overflow:hidden;
}
button{font-family:inherit}
:focus-visible{outline:5px solid var(--focus); outline-offset:2px}
[hidden]{display:none !important}

/* 上方工具列 */
.top{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:10px 20px; background:var(--deep); color:#fff}
.top h1{margin:0; font-size:30px}
.crumb{font-size:26px; font-weight:800; background:rgba(255,255,255,.18); padding:4px 16px; border-radius:12px}
.top .grow{flex:1}
.ghost{
  font-size:24px; font-weight:800; min-height:52px; padding:6px 18px; border-radius:12px;
  border:3px solid #fff; background:transparent; color:#fff; cursor:pointer;
}

main{min-height:0; overflow:auto; padding:12px 20px 14px; display:flex; flex-direction:column}
.screen{flex:1; display:flex; flex-direction:column; min-height:0; gap:12px}
.h2{font-size:38px; font-weight:900; margin:0; color:var(--deep)}
.sub{font-size:26px; margin:0; color:#37474F}

/* ① 選類型 */
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; flex:1; min-height:0}
.card{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  background:#fff; border:6px solid var(--green); border-radius:26px; padding:14px 10px; cursor:pointer; color:inherit;
}
.card:hover{background:#F9FDF4}
.card .demo{display:flex; align-items:flex-end; justify-content:center; gap:8px; min-height:112px}
.card b{font-size:46px; color:var(--deep)}
.card .d{font-size:24px; color:#37474F; text-align:center}

/* ② 看一看兩種葉子 */
.intro-row{flex:1; min-height:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.ex{
  --lf: clamp(120px, min(32vmin, 34vh), 260px);     /* 看一看的畫面可以放大一點 */
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  background:#fff; border:6px solid var(--green); border-radius:26px; padding:10px;
}
.ex{cursor:pointer}
.ex .lfwrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
.ex b{font-size:48px; color:var(--deep)}
.ex span.s{font-size:28px; font-weight:700}
.actions{display:flex; flex-wrap:wrap; gap:14px; justify-content:center}
.primary{
  font-size:32px; font-weight:900; min-height:68px; padding:8px 34px; border-radius:18px;
  border:none; background:var(--green); color:#fff; cursor:pointer;
}
.second{
  font-size:28px; font-weight:800; min-height:68px; padding:8px 26px; border-radius:18px;
  border:5px solid var(--green); background:#fff; color:var(--deep); cursor:pointer;
}

/* 葉子本身 */
.lf{display:block; flex:none}
.lf svg{display:block; width:100%; height:auto; filter:drop-shadow(0 4px 4px rgba(0,0,0,.22))}

/* ③ 分一分 */
.playhead{display:flex; flex-wrap:wrap; align-items:center; gap:6px 18px}
.dots{display:flex; gap:10px; align-items:center; height:38px}
.dots span{display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; border:3px solid #78909C; background:#fff; font-size:26px; line-height:1}
.dots .now{border-color:var(--deep); background:var(--green); box-shadow:0 0 0 4px rgba(46,125,50,.25)}
.dots .good{border:none; background:none; width:34px; height:34px; font-size:32px}
.dots .retry{border-color:#1565C0; background:#1565C0}
.ask{font-size:32px; font-weight:900; color:var(--deep)}
.board{
  flex:1; min-height:0; display:grid; gap:16px;
  grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);
}
.bin{
  display:flex; flex-direction:column; align-items:center; gap:6px; min-height:0; min-width:0;
  padding:10px 10px 8px; background:#fff; border:6px solid var(--green); border-radius:26px; color:inherit; cursor:pointer;
  transition:background .12s, border-color .12s, box-shadow .12s;
}
.bin .lbl{font-size:42px; font-weight:900; color:var(--deep); line-height:1.1}
.bin .samp{flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center}
.bin .got{
  width:100%; min-height:70px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:flex-end;
  border-top:3px dashed var(--soft); padding-top:6px;
}
.bin.hot{box-shadow:0 0 0 8px var(--focus)}
.bin.ok{background:#DCFCE7; border-color:var(--ok)}
.bin.no{background:#FFEDD5; border-color:var(--orange)}
.bin.hint{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.0)}50%{box-shadow:0 0 0 10px rgba(251,191,36,.95)}}

.pad{
  position:relative; display:flex; align-items:center; justify-content:center; min-height:0;
  background:#E8F5E9; border:5px dashed #81C784; border-radius:26px;
}
.cur{cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; transition:transform .18s ease, opacity .25s ease; position:relative; z-index:5}
.cur.held{cursor:grabbing; transition:none; z-index:50}
.cur.pop{animation:pop .3s ease-out}
.cur.gone{opacity:0; transform:scale(.2)}
.cur.shake{animation:shake .4s}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.mini{animation:pop .3s ease-out}
.pad .tip{position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:22px; color:#37474F}

.msg{min-height:2.7em; padding:8px 16px; border-radius:14px; border:3px solid transparent; font-size:28px; font-weight:800}
.msg.info{background:#E0F2FE; border-color:#0369A1; color:#0C4A6E}
.msg.ok{background:#DCFCE7; border-color:var(--ok); color:#14532D}
.msg.try{background:#FFEDD5; border-color:var(--orange); color:#7C2D12}

/* ④ 結果 */
.result{align-items:center; justify-content:center; text-align:center}
.stars{font-size:72px; line-height:1.1}

@media (max-width:720px){
  body{font-size:20px}
  .top{padding:8px 12px}
  .top h1{font-size:24px}
  .crumb,.ghost{font-size:20px; min-height:46px; padding:4px 12px}
  main{padding:10px 12px 12px}
  .h2{font-size:30px}
  .sub{font-size:21px}
  .cards{grid-template-columns:minmax(0,1fr); gap:12px}
  .card{flex-direction:row; justify-content:flex-start; padding:8px 12px}
  .card .demo{min-height:0; flex:none}
  .card b{font-size:36px}
  .card .d{font-size:20px; text-align:left}
  .intro-row{gap:10px}
  .ex b{font-size:34px}
  .ex span.s{font-size:20px}
  .primary,.second{font-size:24px; min-height:58px; padding:6px 20px}
  .ask{font-size:24px}
  .dots{font-size:28px}
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,1.1fr)}
  .pad{grid-column:1 / -1; order:-1}
  .bin .lbl{font-size:30px}
  .bin .got{min-height:46px}
  .msg{font-size:22px}
  .pad .tip{display:none}
  .stars{font-size:54px}
  :root{--lf: clamp(90px, 30vw, 150px)}
}
@media (prefers-reduced-motion:reduce){
  .cur,.mini,.bin{transition:none; animation:none !important}
}
</style>
</head>
<body>

<header class="top">
  <h1>🍃 找一找葉子</h1>
  <span class="crumb" id="crumb" hidden></span>
  <span class="grow"></span>
  <button type="button" class="ghost" id="readBtn">🔊 念給我聽</button>
  <button type="button" class="ghost" id="muteBtn" aria-pressed="false">聲音：開</button>
  <button type="button" class="ghost" id="backBtn" hidden>換一種分法</button>
</header>

<main>
  <!-- ① 選類型 -->
  <section class="screen" id="screenPick">
    <p class="h2" id="pickH"></p>
    <p class="sub" id="pickS"></p>
    <div class="cards" id="cards"></div>
  </section>

  <!-- ② 看一看兩種葉子 -->
  <section class="screen" id="screenIntro" hidden>
    <p class="h2" id="introTitle"></p>
    <div class="intro-row" id="introRow"></div>
    <p class="sub" id="introNote"></p>
    <div class="actions">
      <button type="button" class="second" id="swapBtn">換兩種</button>
      <button type="button" class="primary" id="startBtn">開始分一分 ▶</button>
    </div>
  </section>

  <!-- ③ 分一分 -->
  <section class="screen" id="screenPlay" hidden>
    <div class="playhead">
      <div class="dots" id="dots" aria-label="作答進度"></div>
      <div class="ask" id="ask"></div>
    </div>
    <div class="board" id="board">
      <button type="button" class="bin" id="bin0"><span class="lbl"></span><span class="samp"></span><span class="got"></span></button>
      <div class="pad" id="pad"><div id="spot"></div><div class="tip">把葉子拖到籃子裡，也可以直接點籃子</div></div>
      <button type="button" class="bin" id="bin1"><span class="lbl"></span><span class="samp"></span><span class="got"></span></button>
    </div>
    <div class="msg info" id="msg" aria-live="polite"></div>
  </section>

  <!-- ④ 結果 -->
  <section class="screen result" id="screenResult" hidden>
    <p class="h2" id="resTitle"></p>
    <div class="stars" id="resStars"></div>
    <p class="sub" id="resNote"></p>
    <div class="actions">
      <button type="button" class="primary" id="againBtn">再玩一次</button>
      <button type="button" class="second" id="otherBtn">換一種分法</button>
    </div>
  </section>
</main>

<script>
"use strict";

/* ───────── 葉子的樣子（向量圖，大小／形狀／顏色都精準可控） ───────── */
const SHAPE_KEYS = ["round", "long", "heart", "palm"];
const SHAPES = {round:{label:"圓形"}, long:{label:"長條形"}, heart:{label:"愛心形"}, palm:{label:"手掌形"}};
const COLOR_KEYS = ["green", "yellow", "red", "brown"];
const COLORS = {
  green: {nm:"綠色",   fill:"#43A047", edge:"#1B5E20"},
  yellow:{nm:"黃色",   fill:"#FDD835", edge:"#8A6D00"},
  red:   {nm:"紅色",   fill:"#E53935", edge:"#7F1D1D"},
  brown: {nm:"咖啡色", fill:"#A1693A", edge:"#4E2F14"},
};

// 手掌形：從中心往外有五個尖角，中間夾著較淺的谷
const PALM_PTS = (() => {
  const cx = 100, cy = 128;
  const spec = [[180,26],[-140,34],[-96,68],[-72,40],[-48,96],[-24,46],[0,112],[24,46],[48,96],[72,40],[96,68],[140,34]];
  return spec.map(([a, r]) => { const t = a * Math.PI / 180; return [cx + r * Math.sin(t), cy - r * Math.cos(t)]; });
})();
const PALM_VEINS = [[0,112],[-48,96],[48,96],[-96,68],[96,68]].map(([a, r]) => {
  const t = a * Math.PI / 180;
  return "M100 134L" + (100 + 0.8 * r * Math.sin(t)).toFixed(1) + " " + (128 - 0.8 * r * Math.cos(t)).toFixed(1);
}).join("");

const SHAPE_DEF = {
  round:{
    outline:'<circle cx="100" cy="92" r="72"/>',
    veins:"M100 164V32M100 136L58 102M100 136L142 102M100 106L66 72M100 106L134 72",
    stem:"M100 164V198",
  },
  long:{
    outline:'<path d="M100 186C66 150 60 70 100 6C140 70 134 150 100 186Z"/>',
    veins:"M100 186V18M100 154L80 130M100 154L120 130M100 116L80 92M100 116L120 92M100 78L84 56M100 78L116 56",
    stem:"M100 186V198",
  },
  heart:{
    outline:'<path d="M100 150C76 182 14 160 18 100C21 64 66 44 100 8C134 44 179 64 182 100C186 160 124 182 100 150Z"/>',
    veins:"M100 150V30M100 122L60 92M100 122L140 92M100 90L72 62M100 90L128 62",
    stem:"M100 150V198",
  },
  palm:{
    outline:'<polygon points="' + PALM_PTS.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '"/>',
    veins:PALM_VEINS,
    stem:"M100 154V198",
  },
};

function leafSVG(shape, color, rot){
  const d = SHAPE_DEF[shape], c = COLORS[color];
  return '<svg viewBox="0 0 200 200" aria-hidden="true" focusable="false"' +
         (rot ? ' style="transform:rotate(' + rot + 'deg)"' : "") + ">" +
    '<path d="' + d.stem + '" fill="none" stroke="' + c.edge + '" stroke-width="7" stroke-linecap="round"/>' +
    '<g fill="' + c.fill + '" stroke="' + c.edge + '" stroke-width="6" stroke-linejoin="round">' + d.outline + "</g>" +
    '<path d="' + d.veins + '" fill="none" stroke="' + c.edge + '" stroke-width="4" stroke-linecap="round" opacity=".55"/>' +
    "</svg>";
}
// 一片葉子的外框：寬度＝標準葉寬 × 比例，大小分別就靠這個比例
function leafBox(leaf, cls, id){
  return '<span class="lf ' + (cls || "") + '"' + (id ? ' id="' + id + '"' : "") +
         ' style="width:calc(var(--lf) * ' + leaf.scale + ')">' + leafSVG(leaf.shape, leaf.color, leaf.rot) + "</span>";
}

/* ───────── 小工具 ───────── */
const $ = id => document.getElementById(id);
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function hasTriple(seq){ for(let i = 2; i < seq.length; i++){ if(seq[i] === seq[i-1] && seq[i] === seq[i-2]) return true; } return false; }

   語音檔由 工具腳本\遊戲語音嵌入.py 讀 TEXT 產生，並以 base64 嵌進 VOICE（台灣女聲 HsiaoChen、語速 -5%）。

};
/*TEXT_END*/

/*VOICE_END*/

let voiceOn = true, voiceToken = 0, voiceAudio = null, voiceDone = null;
function stopVoice(){
  voiceToken++;
  if(voiceAudio){ voiceAudio.pause(); voiceAudio = null; }
  if(voiceDone){ const d = voiceDone; voiceDone = null; d(); }     // 被打斷也要讓等著它的流程繼續
}
// 依序念出一串句子；回傳的 Promise 在念完（或被打斷、聲音關閉）時完成
function speak(ids){
  stopVoice();
  const list = (Array.isArray(ids) ? ids : [ids]).filter(id => VOICE[id]);
  if(!voiceOn || !list.length) return Promise.resolve();
  const token = voiceToken;
  return new Promise(resolve => {
    voiceDone = resolve;
    let k = 0;
    const next = () => {
      if(token !== voiceToken) return;
      if(k >= list.length){ voiceDone = null; resolve(); return; }
      const a = new Audio(VOICE[list[k++]]);
      voiceAudio = a;
      a.addEventListener("ended", () => setTimeout(next, 200));
      a.addEventListener("error", next);
      a.play().catch(next);
    };
    next();
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ───────── 三種分法 ───────── */
const KINDS = {
  size: {nm:"大小", d:"大的葉子、小的葉子"},
  shape:{nm:"形狀", d:"圓形、長條形、愛心形、手掌形"},
  color:{nm:"顏色", d:"綠色、黃色、紅色、咖啡色"},
};

const state = {kind:null, cats:[], base:null, order:[], leaves:[], i:0, tries:0, results:[], locked:false, lastPairKey:"", rid:0};

function sentence(cat){ return TEXT["sent_" + cat.key]; }
function catByKey(key){ return state.cats.find(c => c.key === key); }
function introIds(){ return ["intro_" + state.kind, ...state.cats.map(c => "sent_" + c.key), "intro_note"]; }
function resultIds(){
  const n = state.results.filter(Boolean).length;
  return [n === state.leaves.length ? "res_perfect" : "res_done", "n_" + n];
}

// 兩種要分的葉子：大小固定「大／小」；形狀、顏色每次隨機抽兩種
function newPair(){
  const kind = state.kind;
  state.base = {shape: pick(SHAPE_KEYS)};      // 分大小、分顏色時，所有葉子都用同一種形狀
  if(kind === "size"){
    state.cats = [{key:"big", label:"大葉子"}, {key:"small", label:"小葉子"}];
    return;
  }
  const keys = kind === "shape" ? SHAPE_KEYS : COLOR_KEYS;
  let a, b, k;
  do { const s = shuffle(keys); a = s[0]; b = s[1]; k = [a, b].sort().join(); } while(k === state.lastPairKey);
  state.lastPairKey = k;
  state.cats = [a, b].map(key => ({key, label: kind === "shape" ? SHAPES[key].label : COLORS[key].nm}));
}
// 其餘兩個條件固定，只讓「要分的那一項」不一樣
function sampleLeaf(cat){
  if(state.kind === "size")  return {shape:state.base.shape, color:"green", scale: cat.key === "big" ? 0.9 : 0.42};
  if(state.kind === "shape") return {shape:cat.key, color:"green", scale:0.7};
  return {shape:state.base.shape, color:cat.key, scale:0.7};
}
function makeLeaf(cat){
  const rot = Math.round((Math.random() * 2 - 1) * 8);
  if(state.kind === "size")  return {cat:cat.key, shape:state.base.shape, color:"green", scale: cat.key === "big" ? pick([1.0, 0.92]) : pick([0.40, 0.46]), rot};
  if(state.kind === "shape") return {cat:cat.key, shape:cat.key, color:"green", scale:0.8, rot};
  return {cat:cat.key, shape:state.base.shape, color:cat.key, scale:0.8, rot};
}

/* ───────── 畫面切換 ───────── */
function showScreen(name){
  stopVoice();
  state.rid++;                       // 換畫面就讓還在等的「答對後下一片」作廢
  ["Pick", "Intro", "Play", "Result"].forEach(n => { $("screen" + n).hidden = (n !== name); });
  $("backBtn").hidden = name === "Pick";
  $("crumb").hidden = name === "Pick";
  if(state.kind) $("crumb").textContent = "分" + KINDS[state.kind].nm;
}

/* ① 選類型 */
function buildPick(){
  const demos = {
    size: [{shape:"round", color:"green", scale:0.62}, {shape:"round", color:"green", scale:0.28}],
    shape:[{shape:"round", color:"green", scale:0.32}, {shape:"long", color:"green", scale:0.32}, {shape:"heart", color:"green", scale:0.32}, {shape:"palm", color:"green", scale:0.32}],
    color:[{shape:"round", color:"green", scale:0.32}, {shape:"round", color:"yellow", scale:0.32}, {shape:"round", color:"red", scale:0.32}, {shape:"round", color:"brown", scale:0.32}],
  };
  const box = $("cards"); box.textContent = "";
  Object.keys(KINDS).forEach(k => {
    const b = document.createElement("button"); b.type = "button"; b.className = "card"; b.dataset.kind = k;
    b.innerHTML = '<span class="demo">' + demos[k].map(l => leafBox(l, "")).join("") + "</span>" +
                  '<span><b>' + KINDS[k].nm + '</b><br><span class="d">' + KINDS[k].d + "</span></span>";
    b.addEventListener("click", () => startKind(k));
    box.appendChild(b);
  });
}
function startKind(k){ state.kind = k; state.lastPairKey = ""; newPair(); showIntro(); }

/* ② 看一看兩種葉子 */
function showIntro(){
  $("introTitle").textContent = TEXT["intro_" + state.kind];
  $("introNote").textContent = TEXT.intro_note;
  $("introRow").innerHTML = state.cats.map(c =>
    '<div class="ex" data-key="' + c.key + '" role="button" tabindex="0" aria-label="' + c.label + '，點一下聽念法">' +
    '<span class="lfwrap">' + leafBox(sampleLeaf(c), "") + "</span>" +
    "<b>" + c.label + '</b><span class="s">' + sentence(c) + "</span></div>").join("");
  $("introRow").querySelectorAll(".ex").forEach(ex => {
    const say = () => speak(["sent_" + ex.dataset.key]);
    ex.addEventListener("click", say);
    ex.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); say(); } });
  });
  $("swapBtn").hidden = state.kind === "size";
  showScreen("Intro");
  speak(introIds());
}

/* ③ 分一分 */
function renderDots(){
  const box = $("dots"); box.textContent = "";
  state.leaves.forEach((_, k) => {
    const s = document.createElement("span");
    const r = state.results[k];
    if(r === undefined){ if(k === state.i) s.className = "now"; }
    else if(r){ s.className = "good"; s.textContent = "⭐"; }
    else s.className = "retry";
    box.appendChild(s);
  });
}
function setMsg(text, cls){ const m = $("msg"); m.textContent = text; m.className = "msg " + cls; }
function bins(){ return [$("bin0"), $("bin1")]; }

function startPlay(){
  const [a, b] = state.cats.map(c => c.key);
  state.order = shuffle([a, b]);                       // 左右籃子每次隨機
  let seq;
  do { seq = shuffle([a, a, a, b, b, b]); } while(hasTriple(seq));
  state.leaves = seq.map(key => makeLeaf(catByKey(key)));
  state.i = 0; state.results = [];
  bins().forEach((bin, k) => {
    const c = catByKey(state.order[k]);
    bin.querySelector(".lbl").textContent = c.label;
    bin.querySelector(".samp").innerHTML = leafBox(sampleLeaf(c), "");
    bin.querySelector(".got").textContent = "";
    bin.className = "bin";
    bin.setAttribute("aria-label", "放進" + c.label + "的籃子");
  });
  $("ask").textContent = TEXT["ask_" + state.kind];
  showScreen("Play");
  showLeaf();
  speak(["ask_" + state.kind, "play_tip"]);
}
function showLeaf(){
  const L = state.leaves[state.i];
  state.tries = 0; state.locked = false;
  bins().forEach(b => b.classList.remove("ok", "no", "hint", "hot"));
  $("spot").innerHTML = leafBox(L, "cur pop", "curLeaf");
  bindDrag($("curLeaf"));
  renderDots();
  setMsg(TEXT.play_tip, "info");
}

/* 判斷放進哪個籃子 */
function binAt(ev){
  const pad = 14;
  const hit = bins().findIndex(b => {
    const r = b.getBoundingClientRect();
    return ev.clientX >= r.left - pad && ev.clientX <= r.right + pad && ev.clientY >= r.top - pad && ev.clientY <= r.bottom + pad;
  });
  return hit;
}
function hot(k){ bins().forEach((b, j) => b.classList.toggle("hot", j === k)); }
let lastDropAt = 0;

function bindDrag(el){
  el.addEventListener("pointerdown", e => {
    if(state.locked || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    let dragging = false;
    el.setPointerCapture(e.pointerId);
    el.classList.remove("pop", "shake");
    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if(!dragging && Math.hypot(dx, dy) > 6){ dragging = true; el.classList.add("held"); }
      if(dragging){ el.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.06)"; hot(binAt(ev)); }
    };
    const finish = (ev, cancelled) => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      el.removeEventListener("pointercancel", cancel);
      el.classList.remove("held");
      hot(-1);
      const k = (dragging && !cancelled) ? binAt(ev) : -1;
      el.style.transform = "";
      if(k >= 0){ lastDropAt = Date.now(); choose(k); }
    };
    const up = ev => finish(ev, false);
    const cancel = ev => finish(ev, true);
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", cancel);
  });
}

function choose(k){
  if(state.locked) return;
  const L = state.leaves[state.i];
  const bin = bins()[k];
  const cat = catByKey(state.order[k]);
  state.tries++;
  if(cat.key === L.cat){
    state.locked = true;
    state.results[state.i] = state.tries === 1;
    bins().forEach(b => b.classList.remove("hint", "no"));
    bin.classList.add("ok");
    bin.querySelector(".got").insertAdjacentHTML("beforeend", leafBox({shape:L.shape, color:L.color, scale:+(L.scale * 0.42).toFixed(3), rot:L.rot}, "mini"));
    $("curLeaf").classList.add("gone");
    renderDots();
    setMsg(TEXT.good + sentence(cat), "ok");
    const rid = state.rid;
    // 至少停 1 秒（讓葉子落進籃子），聲音念完再換下一片
    Promise.all([sleep(reduced ? 400 : 1000), speak(["good", "sent_" + cat.key])]).then(() => {
      if(rid !== state.rid) return;
      state.i++;
      if(state.i >= state.leaves.length) showResult(); else showLeaf();
    });
  } else {
    bin.classList.add("no");
    setTimeout(() => bin.classList.remove("no"), 600);
    const cur = $("curLeaf");
    cur.classList.remove("shake"); void cur.offsetWidth; cur.classList.add("shake");
    if(state.tries >= 2){
      const right = state.order.indexOf(L.cat);
      bins()[right].classList.add("hint");
      setMsg(TEXT.hint, "try");
      speak(["hint"]);
    } else {
      setMsg(TEXT["again_" + state.kind], "try");
      speak(["again_" + state.kind]);
    }
  }
}

/* ④ 結果 */
function showResult(){
  const n = state.results.filter(Boolean).length, total = state.leaves.length;
  $("resTitle").textContent = n === total ? TEXT.res_perfect : TEXT.res_done;
  $("resStars").textContent = "⭐".repeat(n) + "⚪".repeat(total - n);
  $("resNote").textContent = TEXT["n_" + n];
  showScreen("Result");
  speak(resultIds());
}

/* ───────── 按鈕 ───────── */
bins().forEach((b, k) => b.addEventListener("click", () => {
  if(Date.now() - lastDropAt < 400) return;      // 剛剛拖進去那一下，不要再當成點擊
  choose(k);
}));
$("startBtn").addEventListener("click", startPlay);
$("swapBtn").addEventListener("click", () => { newPair(); showIntro(); });
$("backBtn").addEventListener("click", () => { state.kind = null; showScreen("Pick"); });
$("otherBtn").addEventListener("click", () => { state.kind = null; showScreen("Pick"); });
$("againBtn").addEventListener("click", () => { newPair(); showIntro(); });

$("readBtn").addEventListener("click", () => {
  if(!$("screenPick").hidden) speak(["pick_h", "pick_s"]);
  else if(!$("screenIntro").hidden) speak(introIds());
  else if(!$("screenPlay").hidden) speak(["ask_" + state.kind, "play_tip"]);
  else speak(resultIds());
});
$("muteBtn").addEventListener("click", () => {
  voiceOn = !voiceOn;
  if(!voiceOn) stopVoice();
  $("muteBtn").textContent = voiceOn ? "聲音：開" : "聲音：關";
  $("muteBtn").setAttribute("aria-pressed", String(!voiceOn));
  $("readBtn").disabled = !voiceOn;
});

// 嵌在網站裡、切到別的分區（iframe 被隱藏）時，把還在念的聲音停掉
if("IntersectionObserver" in window){
  new IntersectionObserver(es => { if(es.some(e => !e.isIntersecting)) stopVoice(); }).observe(document.body);
}

$("pickH").textContent = TEXT.pick_h;
$("pickS").textContent = TEXT.pick_s;
buildPick();
showScreen("Pick");
</script>
</body>
</html>
